name: MoveMK
options:
  bundleIdPrefix: com.movemk
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  MoveMK:
    type: application
    platform: iOS
    sources:
      - MovieStream
    settings:
      base:
        INFOPLIST_FILE: MovieStream/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.movemk.app
        PRODUCT_NAME: MoveMK
        DEVELOPMENT_TEAM: ""
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
